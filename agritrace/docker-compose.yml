services:
  database:
    image: mysql:8.4
    container_name: agritrace-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: agriculture_supply_chain
      MYSQL_USER: agritrace
      MYSQL_PASSWORD: agritrace_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uagritrace", "-pagritrace_secret"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    container_name: agritrace-api
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: agriculture_supply_chain
      DB_USER: agritrace
      DB_PASSWORD: agritrace_secret
      JWT_SECRET: change-this-in-production
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      database:
        condition: service_healthy
  frontend:
    build: ./frontend
    container_name: agritrace-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
volumes:
  mysql_data:
